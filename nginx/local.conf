server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # Docker internal DNS resolver to prevent boot crashes if upstreams are starting
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 1. Admin Dashboard
    location /stayoneadmin {
        set $admin_backend "http://admin:3000";
        proxy_pass $admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Backend API - stayoneapi
    location /stayoneapi/ {
        proxy_pass http://backend:8011/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Backend API - standard /api/
    location /api/ {
        proxy_pass http://backend:8011/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Uploads & Static Media
    location /stayonefiles/ {
        proxy_pass http://backend:8011/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. User End Portal (Root)
    location / {
        proxy_pass http://userend:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
